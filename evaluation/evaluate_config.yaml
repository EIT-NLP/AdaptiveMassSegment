# Default AMS evaluation config.
#
# Override values from the CLI, for example:
#   python -m evaluation.evaluate \
#     --model /path/to/DeepSeek-R1-Distill-Qwen-7B \
#     --dataset math500 \
#     --method_name ams_expected \
#     --target_size 512

output_dir: "./results"

# Model can be a Hugging Face model id or a local model directory.
model: ""
device: null  # null -> auto if CUDA is available, otherwise CPU
model_kwargs:
  dtype: "auto"
  attn_implementation: null

# Paper datasets: math500, aime24, aime25, gsm8k.
# Local dataset files can be supplied through env vars:
# MATH500_DATA, AIME24_DATA, AIME25_DATA, GSM8K_DATA.
dataset: "math500"
data_dir: null

# Prefer method_name for reproducibility. See evaluation/method_registry.py.
method_name: "ams_expected"
press_name: "decoding_adaptive_segment_head_expected_attention"
compression_ratio: 1.0

fraction: 1.0
max_new_tokens: null
max_context_length: null
compress_questions: false

compression_interval: 512
target_size: 1024
hidden_states_buffer_size: null

seed: 42
resume_mode: "validate"
write_summary: true
summary_csv: null
record_time: true
record_peak_memory: true
log_level: "INFO"
